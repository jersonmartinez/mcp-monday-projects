name: Feature request
description: Propose a focused capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user value
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: checkboxes
    id: epic
    attributes:
      label: Planning
      options:
        - label: This work is linked to an epic when it spans multiple issues.

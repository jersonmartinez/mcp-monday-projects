name: Bug report
description: Report a reproducible defect
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and real Monday data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include Docker/Compose commands and sanitized input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

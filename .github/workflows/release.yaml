# Release
# On a vX.Y.Z tag: verify the tag matches the code Version and CHANGELOG,
# build the runtime image for linux/amd64 and linux/arm64, push it to GHCR
# (ghcr.io/<owner>/mcp-monday-projects:X.Y.Z, X.Y and latest) and publish a
# GitHub release whose notes are the CHANGELOG section. See docs/RELEASING.md.
name: Release
run-name: 'Release ${{ github.ref_name }}'

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, push and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify tag, code version and CHANGELOG
        run: bash scripts/release_notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mcp-monday-projects
            org.opencontainers.image.description=Docker-first MCP server for monday.com

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --verify-tag
